aid: hackernoon
name: Hackernoon
description: >-
  HackerNoon is an independent technology publishing platform and community CMS, founded in
  2016 by David Smooke and headquartered in Edwards, Colorado. It operates a free, open
  library of more than 150,000 practitioner-authored, human-edited technology stories from
  35,000+ contributing engineers, covering AI, software engineering, Web3, cybersecurity,
  startups and science, and serves roughly 3-4 million monthly readers. The company builds
  and open-sources the publishing software behind the site — the Chowa collaborative editor,
  the Pixel Icon Library, the HackerNoon pixel font and the Editing Protocol — and monetises
  through business blogging credits, targeted ads, newsletters and AI content licensing.
  HackerNoon publishes no public API: probed on 2026-08-22, it serves no OpenAPI, GraphQL,
  MCP or A2A surface. Its machine-readable surface is a content and AI-access one — an
  llms.txt, a per-crawler robots.txt policy, RSS feeds and sitemaps — with a "live content
  feed API" advertised in llms.txt as coming in Q3 2026 and not yet shipped.
